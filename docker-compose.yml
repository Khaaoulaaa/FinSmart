services:
  postgres:
    image: postgres:16
    container_name: finsmart-postgres
    environment:
      POSTGRES_DB: finsmart
      POSTGRES_USER: finsmart
      POSTGRES_PASSWORD: finsmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: finsmart-api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://finsmart:finsmart@postgres:5432/finsmart
    ports:
      - "8000:8000"

volumes:
  postgres_data:

